[project]
name = "citedelta"
version = "0.1.0"
description = "Bitemporal hybrid search over versioned regulations."
requires-python = ">=3.12"
dependencies = [
    "substrate",
    "alembic>=1.14",
    "asyncpg>=0.30",
    "greenlet>=3.1",
    "httpx>=0.28",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "structlog>=24.4",
    "typer>=0.15",
    "fastembed>=0.8.0",
    "numpy>=2.5.1",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    "prometheus-client>=0.21",
    "python-multipart>=0.0.9",
]

[project.scripts]
citedelta = "citedelta.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/citedelta"]

[tool.uv.sources]
substrate = { workspace = true }
