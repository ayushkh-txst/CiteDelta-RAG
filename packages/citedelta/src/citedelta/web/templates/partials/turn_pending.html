<article class="turn turn-pending" data-turn-id="{{ turn_id }}">
  <div class="stamp"><span class="day">{{ stamp_day }}</span><span class="year">{{ stamp_year }}</span></div>
  <div class="body">
    <h2 class="question">{{ question }}</h2>
    <div class="phases" data-phases aria-live="polite" aria-atomic="false"></div>
  </div>
</article>
