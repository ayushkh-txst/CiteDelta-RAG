# Render Blueprint — see docs/deploy/free-hosting.md.
# Docker Spaces on Hugging Face now require a paid plan (Aug 2026), so Render
# is the app host; Supabase remains the free Postgres. `New -> Blueprint` in
# the Render dashboard, pointed at this repo, picks this up automatically.
services:
  - type: web
    name: citedelta
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: LLM_PROVIDER
        value: openrouter
      - key: OPENROUTER_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
